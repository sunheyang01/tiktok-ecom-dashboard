<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok 电商数据看板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d29;
            --border: #2a2d3a;
            --text: #e4e6eb;
            --text2: #8b8fa3;
            --blue: #4e7cff;
            --green: #00c48c;
            --red: #ff4757;
            --orange: #ff9f43;
            --purple: #a855f7;
            --cyan: #06b6d4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1d29, #252836);
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .header h1 span { color: var(--blue); }
        .header-info {
            display: flex; gap: 16px; align-items: center;
            font-size: 13px; color: var(--text2);
        }
        .filters {
            padding: 16px 24px;
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .filters label { font-size: 13px; color: var(--text2); }
        .filters select, .filters input {
            background: var(--card); border: 1px solid var(--border);
            color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 13px;
        }
        .filters select:focus, .filters input:focus { outline: none; border-color: var(--blue); }
        .container { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
        .kpi-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px; margin-bottom: 24px;
        }
        .kpi-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px;
        }
        .kpi-card .label { font-size: 13px; color: var(--text2); margin-bottom: 8px; }
        .kpi-card .value { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .kpi-card .change { font-size: 12px; display: flex; gap: 12px; }
        .up { color: var(--green); }
        .down { color: var(--red); }
        .flat { color: var(--text2); }
        .section-title {
            font-size: 16px; font-weight: 600; margin: 24px 0 16px;
            padding-left: 12px; border-left: 3px solid var(--blue);
        }
        .section-title.eu { border-left-color: var(--cyan); }
        .charts-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 16px; margin-bottom: 24px;
        }
        .chart-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px;
        }
        .chart-card h3 { font-size: 15px; margin-bottom: 16px; font-weight: 500; }
        .table-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; overflow-x: auto; margin-bottom: 24px;
        }
        .table-card h3 { font-size: 15px; margin-bottom: 16px; font-weight: 500; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead th {
            text-align: left; padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text2); font-weight: 500; white-space: nowrap;
            cursor: pointer; user-select: none;
        }
        thead th:hover { color: var(--blue); }
        tbody td {
            padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
        }
        tbody tr:hover { background: rgba(78, 124, 255, 0.05); }
        .status-active { color: var(--green); }
        .status-inactive { color: var(--red); }
        .status-other { color: var(--orange); }
        .region-tag {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 11px; font-weight: 600;
        }
        .region-us { background: rgba(78,124,255,0.15); color: var(--blue); }
        .region-eu { background: rgba(6,182,212,0.15); color: var(--cyan); }
        .loading {
            text-align: center; padding: 80px 20px; color: var(--text2); font-size: 16px;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border);
            border-top-color: var(--blue); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .tab-btn {
            padding: 10px 20px; background: none; border: none; color: var(--text2);
            cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
        .tab-btn:hover { color: var(--text); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .header, .container { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><span>TikTok</span> 电商数据看板</h1>
        <div class="header-info">
            <span id="updateTime">更新时间: --</span>
            <span id="totalRecords">记录数: --</span>
        </div>
    </div>
    <div class="filters">
        <label>区域:</label>
        <select id="filterRegion"><option value="">全部</option><option value="美区">美区</option><option value="EU">EU</option></select>
        <label>日期:</label>
        <input type="date" id="dateFrom">
        <span style="color:var(--text2)">至</span>
        <input type="date" id="dateTo">
        <label>账号:</label>
        <select id="filterAccount"><option value="">全部</option></select>
        <label>归属人:</label>
        <select id="filterOwner"><option value="">全部</option></select>
        <label>状态:</label>
        <select id="filterStatus"><option value="">全部</option></select>
    </div>
    <div class="container">
        <div id="loading" class="loading"><div class="spinner"></div><div>加载数据中...</div></div>
        <div id="dashboard" style="display:none;">
            <div class="tabs">
                <button class="tab-btn active" data-tab="overview">总览</button>
                <button class="tab-btn" data-tab="accounts">账号分析</button>
                <button class="tab-btn" data-tab="detail">明细数据</button>
            </div>
            <div class="tab-content active" id="tab-overview">
                <div class="kpi-grid" id="cumulativeGrid"></div>
                <div style="height:1px;background:var(--border);margin-bottom:24px;"></div>
                <div class="kpi-grid" id="kpiGrid"></div>
                <div class="charts-grid">
                    <div class="chart-card"><h3>GMV 趋势</h3><canvas id="chartGMV"></canvas></div>
                    <div class="chart-card"><h3>佣金趋势</h3><canvas id="chartCommission"></canvas></div>
                    <div class="chart-card"><h3>电商出单趋势</h3><canvas id="chartOrders"></canvas></div>
                    <div class="chart-card"><h3>提现 vs 冻结金额</h3><canvas id="chartCashFreeze"></canvas></div>
                </div>
                <!-- EU 内容指标区域（仅当有EU数据时显示） -->
                <div id="euSection" style="display:none;">
                    <div class="section-title eu">EU 区内容指标</div>
                    <div class="kpi-grid" id="euKpiGrid"></div>
                    <div class="charts-grid">
                        <div class="chart-card"><h3>EU 播放量趋势</h3><canvas id="chartPlays"></canvas></div>
                        <div class="chart-card"><h3>EU CTR / CTOR 趋势</h3><canvas id="chartCTR"></canvas></div>
                    </div>
                </div>
            </div>
            <div class="tab-content" id="tab-accounts">
                <div class="kpi-grid" id="accountKpi"></div>
                <div class="charts-grid">
                    <div class="chart-card"><h3>账号 GMV 排名</h3><canvas id="chartAccountGMV"></canvas></div>
                    <div class="chart-card"><h3>账号佣金排名</h3><canvas id="chartAccountComm"></canvas></div>
                </div>
                <div class="table-card">
                    <h3>账号汇总表</h3>
                    <table id="accountTable">
                        <thead><tr>
                            <th data-sort="0">账号</th><th data-sort="1">区域</th><th data-sort="2">归属人</th><th data-sort="3">状态</th>
                            <th data-sort="4">GMV</th><th data-sort="5">佣金</th><th data-sort="6">提现金额</th>
                            <th data-sort="7">冻结金额</th><th data-sort="8">出单数</th>
                            <th data-sort="9">日环比GMV</th><th data-sort="10">周同比GMV</th>
                        </tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
            <div class="tab-content" id="tab-detail">
                <div class="table-card">
                    <h3>全部明细记录</h3>
                    <table id="detailTable">
                        <thead><tr>
                            <th data-sort="0">日期</th><th data-sort="1">账号</th><th data-sort="2">区域</th>
                            <th data-sort="3">归属人</th><th data-sort="4">状态</th>
                            <th data-sort="5">GMV</th><th data-sort="6">佣金</th>
                            <th data-sort="7">提现金额</th><th data-sort="8">冻结金额</th><th data-sort="9">出单数</th>
                            <th data-sort="10">播放量</th><th data-sort="11">完播率</th>
                            <th data-sort="12">CTR</th><th data-sort="13">CTOR</th>
                        </tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
<script>
let rawData=null, filteredRecords=[], charts={}, sortState={};
const METRICS=["GMV","佣金","提现金额","冻结金额","电商出单"];
const EU_METRICS=["播放量","完播率","CTR","CTOR"];
const MONEY=["GMV","佣金","提现金额","冻结金额"];
const C={blue:'#4e7cff',green:'#00c48c',red:'#ff4757',orange:'#ff9f43',purple:'#a855f7',cyan:'#06b6d4'};
const MC={"GMV":C.blue,"佣金":C.green,"提现金额":C.orange,"冻结金额":C.red,"电商出单":C.purple};

function fmt(v,m){return m?'$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):Number(v).toLocaleString();}
function pct(c,p){if(!p)return c>0?100:0;return(c-p)/p*100;}
function chg(p){const cls=p>0?'up':p<0?'down':'flat',a=p>0?'↑':p<0?'↓':'→';return`<span class="${cls}">${a} ${Math.abs(p).toFixed(1)}%</span>`;}
function stCls(s){if(!s)return'status-other';if(/正常|活跃|active/i.test(s))return'status-active';if(/封|停|ban|inactive/i.test(s))return'status-inactive';return'status-other';}
function regionTag(r){if(r==='EU')return'<span class="region-tag region-eu">EU</span>';return'<span class="region-tag region-us">美区</span>';}

async function loadData(){
    try{
        const r=await fetch('data/dashboard.json?v='+Date.now());
        if(!r.ok)throw new Error('HTTP '+r.status);
        rawData=await r.json();
        document.getElementById('updateTime').textContent='更新: '+rawData.updated_at;
        document.getElementById('totalRecords').textContent='记录: '+rawData.records.length;
        initFilters(); applyFilters();
        document.getElementById('loading').style.display='none';
        document.getElementById('dashboard').style.display='block';
    }catch(e){
        document.getElementById('loading').innerHTML='<div style="color:var(--red)">数据加载失败<br><small>'+e.message+'</small><br><br><small>请先运行 python scripts/analyze.py 生成数据</small></div>';
    }
}

function initFilters(){
    const a=new Set,o=new Set,s=new Set,dates=[];
    rawData.records.forEach(r=>{if(r['账号'])a.add(r['账号']);if(r['归属人'])o.add(r['归属人']);if(r['账号状态'])s.add(r['账号状态']);if(r['日期'])dates.push(r['日期']);});
    fill('filterAccount',[...a].sort());fill('filterOwner',[...o].sort());fill('filterStatus',[...s].sort());
    if(dates.length){dates.sort();document.getElementById('dateFrom').value=dates[0];document.getElementById('dateTo').value=dates[dates.length-1];}
}
function fill(id,items){const el=document.getElementById(id);items.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o);});}

function applyFilters(){
    const f=document.getElementById('dateFrom').value,t=document.getElementById('dateTo').value;
    const a=document.getElementById('filterAccount').value,o=document.getElementById('filterOwner').value;
    const s=document.getElementById('filterStatus').value,rg=document.getElementById('filterRegion').value;
    filteredRecords=rawData.records.filter(r=>{
        if(f&&r['日期']<f)return false;if(t&&r['日期']>t)return false;
        if(a&&r['账号']!==a)return false;if(o&&r['归属人']!==o)return false;
        if(s&&r['账号状态']!==s)return false;
        if(rg&&(r['区域']||'美区')!==rg)return false;
        return true;
    });
    renderAll();
}
document.querySelectorAll('.filters select,.filters input').forEach(el=>el.addEventListener('change',applyFilters));

function renderAll(){renderCumulative();renderKPI();renderCharts();renderEU();renderAccountTab();renderDetail();}

function renderCumulative(){
    const g=document.getElementById('cumulativeGrid');
    const cum=rawData.cumulative||{};
    const items=[
        {label:'总订单量',key:'电商出单',color:C.purple,money:false},
        {label:'总 GMV',key:'GMV',color:C.blue,money:true},
        {label:'总佣金',key:'佣金',color:C.green,money:true},
        {label:'总冻结金额',key:'冻结金额',color:C.red,money:true},
    ];
    g.innerHTML=items.map(it=>`<div class="kpi-card">
        <div class="label">${it.label}（累计）</div>
        <div class="value" style="color:${it.color}">${fmt(cum[it.key]||0,it.money)}</div>
    </div>`).join('');
}

function renderKPI(){
    const g=document.getElementById('kpiGrid');
    const dates=[...new Set(filteredRecords.map(r=>r['日期']))].sort();
    const lat=dates[dates.length-1],prev=dates[dates.length-2];
    const wa=lat?(()=>{const d=new Date(lat);d.setDate(d.getDate()-7);return d.toISOString().slice(0,10);})():null;
    const sum=d=>{const rows=filteredRecords.filter(r=>r['日期']===d);const s={};METRICS.forEach(m=>s[m]=rows.reduce((a,r)=>a+(r[m]||0),0));return s;};
    const ts=lat?sum(lat):{},ps=prev?sum(prev):{},ws=wa?sum(wa):{};
    g.innerHTML=METRICS.map(m=>{
        const v=ts[m]||0,im=MONEY.includes(m);
        return`<div class="kpi-card"><div class="label">${m}</div><div class="value" style="color:${MC[m]}">${fmt(v,im)}</div><div class="change"><span>日环比 ${chg(pct(v,ps[m]||0))}</span><span>周同比 ${chg(pct(v,ws[m]||0))}</span></div></div>`;
    }).join('');
}

function renderCharts(){
    const dm={};
    filteredRecords.forEach(r=>{const d=r['日期'];if(!d)return;if(!dm[d])dm[d]={};METRICS.forEach(m=>dm[d][m]=(dm[d][m]||0)+(r[m]||0));});
    const dates=Object.keys(dm).sort();
    const chartOpts=(legend)=>({responsive:true,plugins:{legend:{display:!!legend,labels:{color:'#8b8fa3'}}},scales:{x:{ticks:{color:'#8b8fa3',maxRotation:45,maxTicksLimit:15},grid:{color:'#2a2d3a'}},y:{ticks:{color:'#8b8fa3'},grid:{color:'#2a2d3a'}}}});
    function mk(id,metric,color){
        if(charts[id])charts[id].destroy();
        charts[id]=new Chart(document.getElementById(id),{type:'line',data:{labels:dates,datasets:[{label:metric,data:dates.map(d=>dm[d][metric]||0),borderColor:color,backgroundColor:color+'20',fill:true,tension:0.3,pointRadius:2}]},options:chartOpts()});
    }
    mk('chartGMV','GMV',C.blue);mk('chartCommission','佣金',C.green);mk('chartOrders','电商出单',C.purple);
    if(charts['chartCashFreeze'])charts['chartCashFreeze'].destroy();
    charts['chartCashFreeze']=new Chart(document.getElementById('chartCashFreeze'),{type:'bar',data:{labels:dates,datasets:[{label:'提现金额',data:dates.map(d=>dm[d]['提现金额']||0),backgroundColor:C.orange+'80'},{label:'冻结金额',data:dates.map(d=>dm[d]['冻结金额']||0),backgroundColor:C.red+'80'}]},options:chartOpts(true)});
}

function renderEU(){
    const euRecords=filteredRecords.filter(r=>(r['区域']||'美区')==='EU');
    const section=document.getElementById('euSection');
    if(euRecords.length===0){section.style.display='none';return;}
    section.style.display='block';

    // EU KPI
    const dates=[...new Set(euRecords.map(r=>r['日期']))].sort();
    const lat=dates[dates.length-1];
    const todayEU=euRecords.filter(r=>r['日期']===lat);
    const totalPlays=todayEU.reduce((s,r)=>s+(r['播放量']||0),0);
    const avgCR=todayEU.length?todayEU.reduce((s,r)=>s+(r['完播率']||0),0)/todayEU.length:0;
    const avgCTR=todayEU.length?todayEU.reduce((s,r)=>s+(r['CTR']||0),0)/todayEU.length:0;
    const avgCTOR=todayEU.length?todayEU.reduce((s,r)=>s+(r['CTOR']||0),0)/todayEU.length:0;

    document.getElementById('euKpiGrid').innerHTML=[
        {label:'今日播放量',value:totalPlays.toLocaleString(),color:C.cyan},
        {label:'平均完播率',value:avgCR.toFixed(2)+'%',color:C.green},
        {label:'平均CTR',value:avgCTR.toFixed(2)+'%',color:C.orange},
        {label:'平均CTOR',value:avgCTOR.toFixed(2)+'%',color:C.purple},
    ].map(it=>`<div class="kpi-card"><div class="label">${it.label}</div><div class="value" style="color:${it.color}">${it.value}</div></div>`).join('');

    // EU趋势图
    const dm={};
    euRecords.forEach(r=>{const d=r['日期'];if(!d)return;if(!dm[d]){dm[d]={plays:0,ctr:[],ctor:[]};}dm[d].plays+=(r['播放量']||0);dm[d].ctr.push(r['CTR']||0);dm[d].ctor.push(r['CTOR']||0);});
    const chartOpts={responsive:true,plugins:{legend:{labels:{color:'#8b8fa3'}}},scales:{x:{ticks:{color:'#8b8fa3',maxRotation:45,maxTicksLimit:15},grid:{color:'#2a2d3a'}},y:{ticks:{color:'#8b8fa3'},grid:{color:'#2a2d3a'}}}};

    if(charts['chartPlays'])charts['chartPlays'].destroy();
    charts['chartPlays']=new Chart(document.getElementById('chartPlays'),{type:'bar',data:{labels:dates,datasets:[{label:'播放量',data:dates.map(d=>dm[d]?dm[d].plays:0),backgroundColor:C.cyan+'80',borderColor:C.cyan,borderWidth:1}]},options:{...chartOpts,plugins:{legend:{display:false}}}});

    if(charts['chartCTR'])charts['chartCTR'].destroy();
    const avg=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
    charts['chartCTR']=new Chart(document.getElementById('chartCTR'),{type:'line',data:{labels:dates,datasets:[{label:'CTR %',data:dates.map(d=>dm[d]?avg(dm[d].ctr):0),borderColor:C.orange,backgroundColor:C.orange+'20',fill:false,tension:0.3,pointRadius:2},{label:'CTOR %',data:dates.map(d=>dm[d]?avg(dm[d].ctor):0),borderColor:C.purple,backgroundColor:C.purple+'20',fill:false,tension:0.3,pointRadius:2}]},options:chartOpts});
}

function renderAccountTab(){
    const am={};
    filteredRecords.forEach(r=>{
        const a=r['账号']||'未知';
        if(!am[a])am[a]={'归属人':r['归属人']||'','账号状态':r['账号状态']||'','区域':r['区域']||'美区',daily:{}};
        METRICS.forEach(m=>am[a][m]=(am[a][m]||0)+(r[m]||0));
        const d=r['日期'];if(d){if(!am[a].daily[d])am[a].daily[d]={};METRICS.forEach(m=>am[a].daily[d][m]=(am[a].daily[d][m]||0)+(r[m]||0));}
    });
    const accts=Object.entries(am);
    const dates=[...new Set(filteredRecords.map(r=>r['日期']))].sort();
    const lat=dates[dates.length-1],prev=dates[dates.length-2];
    const wa=lat?(()=>{const d=new Date(lat);d.setDate(d.getDate()-7);return d.toISOString().slice(0,10);})():null;
    const ac=accts.filter(([,v])=>/正常|活跃|active/i.test(v['账号状态'])).length;
    const usCount=accts.filter(([,v])=>v['区域']!=='EU').length;
    const euCount=accts.filter(([,v])=>v['区域']==='EU').length;
    document.getElementById('accountKpi').innerHTML=`
        <div class="kpi-card"><div class="label">总账号数</div><div class="value" style="color:${C.blue}">${accts.length}</div><div class="change"><span class="flat">美区 ${usCount} | EU ${euCount}</span></div></div>
        <div class="kpi-card"><div class="label">活跃账号</div><div class="value" style="color:${C.green}">${ac}</div></div>
        <div class="kpi-card"><div class="label">今日出单账号</div><div class="value" style="color:${C.purple}">${accts.filter(([,v])=>v.daily[lat]&&v.daily[lat]['电商出单']>0).length}</div></div>
        <div class="kpi-card"><div class="label">平均GMV/账号</div><div class="value" style="color:${C.orange}">$${accts.length?(accts.reduce((s,[,v])=>s+v.GMV,0)/accts.length).toFixed(2):'0'}</div></div>`;
    function bar(id,metric,color){
        if(charts[id])charts[id].destroy();
        const items=[...accts].sort((a,b)=>b[1][metric]-a[1][metric]).slice(0,15);
        charts[id]=new Chart(document.getElementById(id),{type:'bar',data:{labels:items.map(([n])=>n.length>12?n.slice(0,12)+'…':n),datasets:[{data:items.map(([,v])=>v[metric]),backgroundColor:color+'80',borderColor:color,borderWidth:1}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8b8fa3'},grid:{color:'#2a2d3a'}},y:{ticks:{color:'#8b8fa3'},grid:{display:false}}}}});
    }
    bar('chartAccountGMV','GMV',C.blue);bar('chartAccountComm','佣金',C.green);
    const tb=document.querySelector('#accountTable tbody');
    tb.innerHTML=accts.map(([n,v])=>{
        const tg=v.daily[lat]?v.daily[lat].GMV||0:0,pg=v.daily[prev]?v.daily[prev].GMV||0:0,wg=v.daily[wa]?v.daily[wa].GMV||0:0;
        return`<tr><td>${n}</td><td>${regionTag(v['区域'])}</td><td>${v['归属人']}</td><td class="${stCls(v['账号状态'])}">${v['账号状态']||'-'}</td><td>${fmt(v.GMV,1)}</td><td>${fmt(v['佣金'],1)}</td><td>${fmt(v['提现金额'],1)}</td><td>${fmt(v['冻结金额'],1)}</td><td>${fmt(v['电商出单'])}</td><td>${chg(pct(tg,pg))}</td><td>${chg(pct(tg,wg))}</td></tr>`;
    }).join('');
}

function renderDetail(){
    const tb=document.querySelector('#detailTable tbody');
    const sorted=[...filteredRecords].sort((a,b)=>(b['日期']||'').localeCompare(a['日期']||''));
    tb.innerHTML=sorted.map(r=>{
        const isEU=(r['区域']||'美区')==='EU';
        return`<tr><td>${r['日期']||'-'}</td><td>${r['账号']||'-'}</td><td>${regionTag(r['区域']||'美区')}</td><td>${r['归属人']||'-'}</td><td class="${stCls(r['账号状态'])}">${r['账号状态']||'-'}</td><td>${fmt(r.GMV||0,1)}</td><td>${fmt(r['佣金']||0,1)}</td><td>${fmt(r['提现金额']||0,1)}</td><td>${fmt(r['冻结金额']||0,1)}</td><td>${fmt(r['电商出单']||0)}</td><td>${isEU?(r['播放量']||0).toLocaleString():'-'}</td><td>${isEU?(r['完播率']||0)+'%':'-'}</td><td>${isEU?(r['CTR']||0)+'%':'-'}</td><td>${isEU?(r['CTOR']||0)+'%':'-'}</td></tr>`;
    }).join('');
}

document.querySelectorAll('.tab-btn').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('tab-'+b.dataset.tab).classList.add('active');});});

document.querySelectorAll('th[data-sort]').forEach(th=>{th.addEventListener('click',()=>{const idx=parseInt(th.dataset.sort);const table=th.closest('table');const tbody=table.querySelector('tbody');const rows=[...tbody.querySelectorAll('tr')];const dir=sortState[table.id+idx]==='asc'?'desc':'asc';sortState[table.id+idx]=dir;rows.sort((a,b)=>{let va=a.children[idx].textContent.replace(/[$,%↑↓→\s]/g,''),vb=b.children[idx].textContent.replace(/[$,%↑↓→\s]/g,'');const na=parseFloat(va),nb=parseFloat(vb);if(!isNaN(na)&&!isNaN(nb))return dir==='asc'?na-nb:nb-na;return dir==='asc'?va.localeCompare(vb):vb.localeCompare(va);});rows.forEach(r=>tbody.appendChild(r));});});

loadData();
</script>
</body>
