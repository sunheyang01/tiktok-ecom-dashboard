<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok 电商数据看板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg: #0f1724;
            --card-bg: #1a2332;
            --card-border: #2a3a4e;
            --text: #e0e8f0;
            --text-secondary: #8899aa;
            --accent: #4fc3f7;
            --green: #66bb6a;
            --red: #ef5350;
            --orange: #ffa726;
            --purple: #ab47bc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a2332 0%, #0d2137 100%);
            padding: 20px 24px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 22px;
            background: linear-gradient(90deg, #4fc3f7, #ab47bc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .update-info {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .filters {
            padding: 16px 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filters select, .filters input {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--card-border);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .filters select:focus, .filters input:focus {
            border-color: var(--accent);
        }
        .filters label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-right: 4px;
        }
        .container {
            padding: 0 24px 24px;
            max-width: 1600px;
            margin: 0 auto;
        }
        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .kpi-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s;
        }
        .kpi-card:hover { transform: translateY(-2px); }
        .kpi-card .label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .kpi-card .value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .kpi-card .compare {
            font-size: 12px;
            display: flex;
            gap: 12px;
        }
        .up { color: var(--green); }
        .down { color: var(--red); }
        .flat { color: var(--text-secondary); }
        /* Chart Grid */
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
        }
        .chart-card h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: var(--accent);
        }
        .chart-box {
            width: 100%;
            height: 320px;
        }
        /* Table */
        .table-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
            margin-bottom: 24px;
        }
        .table-card h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: var(--accent);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            background: #0f1724;
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--card-border);
            position: sticky;
            top: 0;
            white-space: nowrap;
        }
        td {
            padding: 10px 14px;
            border-bottom: 1px solid #1e2d3d;
            white-space: nowrap;
        }
        tr:hover td { background: rgba(79,195,247,0.05); }
        .status-active {
            background: rgba(102,187,106,0.15);
            color: var(--green);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        .status-inactive {
            background: rgba(239,83,80,0.15);
            color: var(--red);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        .tab-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab-bar button {
            padding: 8px 20px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .tab-bar button.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 600;
        }
        .tab-bar button:hover:not(.active) {
            border-color: var(--accent);
            color: var(--text);
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state h2 { margin-bottom: 8px; color: var(--text); }

        @media (max-width: 768px) {
            .header { padding: 16px; }
            .filters { padding: 12px 16px; }
            .container { padding: 0 16px 16px; }
            .kpi-card .value { font-size: 22px; }
            .chart-grid { grid-template-columns: 1fr; }
            .chart-box { height: 260px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>TikTok 电商数据看板</h1>
            <div class="update-info" id="updateInfo">数据加载中...</div>
        </div>
    </div>

    <div class="filters">
        <div>
            <label>日期范围</label>
            <input type="date" id="startDate">
            <span style="color:var(--text-secondary)">~</span>
            <input type="date" id="endDate">
        </div>
        <div>
            <label>账号</label>
            <select id="accountFilter"><option value="">全部账号</option></select>
        </div>
        <div>
            <label>归属人</label>
            <select id="ownerFilter"><option value="">全部归属人</option></select>
        </div>
    </div>

    <div class="container">
        <div class="tab-bar">
            <button class="active" onclick="switchTab('overview')">总览</button>
            <button onclick="switchTab('accounts')">账号分析</button>
            <button onclick="switchTab('owners')">归属人分析</button>
            <button onclick="switchTab('detail')">明细数据</button>
        </div>

        <!-- 总览 Tab -->
        <div id="tab-overview">
            <div class="kpi-grid" id="kpiGrid"></div>
            <div class="chart-grid">
                <div class="chart-card">
                    <h3>GMV & 佣金趋势</h3>
                    <div class="chart-box" id="chartGmvCommission"></div>
                </div>
                <div class="chart-card">
                    <h3>电商出单趋势</h3>
                    <div class="chart-box" id="chartOrders"></div>
                </div>
                <div class="chart-card">
                    <h3>提现金额 & 冻结金额</h3>
                    <div class="chart-box" id="chartWithdrawalFrozen"></div>
                </div>
                <div class="chart-card">
                    <h3>归属人 GMV 占比</h3>
                    <div class="chart-box" id="chartOwnerPie"></div>
                </div>
            </div>
        </div>

        <!-- 账号分析 Tab -->
        <div id="tab-accounts" style="display:none">
            <div class="table-card">
                <h3>账号排行榜 (全量汇总)</h3>
                <table id="accountTable">
                    <thead>
                        <tr>
                            <th>排名</th><th>账号</th><th>归属人</th><th>状态</th>
                            <th>GMV</th><th>佣金</th><th>提现金额</th><th>冻结金额</th><th>出单数</th><th>活跃天数</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="chart-card" style="margin-bottom:24px">
                <h3>各账号 GMV 对比</h3>
                <div class="chart-box" id="chartAccountBar" style="height:400px"></div>
            </div>
        </div>

        <!-- 归属人分析 Tab -->
        <div id="tab-owners" style="display:none">
            <div class="table-card">
                <h3>归属人汇总</h3>
                <table id="ownerTable">
                    <thead>
                        <tr>
                            <th>归属人</th><th>管理账号数</th>
                            <th>GMV</th><th>佣金</th><th>提现金额</th><th>冻结金额</th><th>出单数</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- 明细数据 Tab -->
        <div id="tab-detail" style="display:none">
            <div class="table-card">
                <h3>全量明细数据</h3>
                <table id="detailTable">
                    <thead>
                        <tr>
                            <th>日期</th><th>账号</th><th>归属人</th><th>状态</th>
                            <th>GMV</th><th>佣金</th><th>提现金额</th><th>冻结金额</th><th>出单数</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
// ========== 全局状态 ==========
let rawData = null;
let charts = {};
const metricNames = {gmv:'GMV', commission:'佣金', withdrawal:'提现金额', frozen:'冻结金额', orders:'电商出单'};
const metricColors = {gmv:'#4fc3f7', commission:'#ffa726', withdrawal:'#66bb6a', frozen:'#ef5350', orders:'#ab47bc'};

// ========== 初始化 ==========
async function init() {
    try {
        const resp = await fetch('data/sales_data.json?' + Date.now());
        rawData = await resp.json();
    } catch(e) {
        document.querySelector('.container').innerHTML = `
            <div class="empty-state">
                <div class="icon">📭</div>
                <h2>暂无数据</h2>
                <p>数据文件加载失败，请检查 data/sales_data.json 是否存在</p>
            </div>`;
        return;
    }

    if (!rawData.daily_trend || rawData.daily_trend.length === 0) {
        document.querySelector('.container').innerHTML = `
            <div class="empty-state">
                <div class="icon">📊</div>
                <h2>等待数据录入</h2>
                <p>飞书多维表格中暂无数据，数据录入后将自动展示</p>
                <p style="margin-top:8px;font-size:13px">更新时间：${rawData.update_time || '未知'}</p>
            </div>`;
        return;
    }

    // 更新头部信息
    document.getElementById('updateInfo').innerHTML =
        `更新时间：${rawData.update_time} | 共 ${rawData.total_records} 条记录 | ${rawData.total_accounts} 个账号 | 数据范围：${rawData.date_range.start} ~ ${rawData.date_range.end}`;

    // 初始化筛选器
    initFilters();
    // 渲染所有模块
    renderAll();

    // 监听筛选变化
    ['startDate','endDate','accountFilter','ownerFilter'].forEach(id => {
        document.getElementById(id).addEventListener('change', renderAll);
    });

    // 窗口大小变化时重置图表
    window.addEventListener('resize', () => {
        Object.values(charts).forEach(c => c && c.resize());
    });
}

function initFilters() {
    const dates = rawData.daily_trend.map(d => d.date);
    document.getElementById('startDate').value = dates[0];
    document.getElementById('endDate').value = dates[dates.length - 1];

    const accountSel = document.getElementById('accountFilter');
    rawData.account_totals.forEach(a => {
        accountSel.innerHTML += `<option value="${a.account}">${a.account}</option>`;
    });

    const ownerSel = document.getElementById('ownerFilter');
    rawData.owner_totals.forEach(o => {
        ownerSel.innerHTML += `<option value="${o.owner}">${o.owner}</option>`;
    });
}

function getFilteredTrend() {
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    const account = document.getElementById('accountFilter').value;
    const owner = document.getElementById('ownerFilter').value;

    if (!account && !owner) {
        // 使用汇总趋势
        return rawData.daily_trend.filter(d => d.date >= start && d.date <= end);
    }

    // 需要从明细数据重新聚合
    const result = {};
    for (const [date, records] of Object.entries(rawData.daily_account_detail)) {
        if (date < start || date > end) continue;
        const filtered = records.filter(r => {
            if (account && r.account !== account) return false;
            if (owner && r.owner !== owner) return false;
            return true;
        });
        if (filtered.length === 0) continue;
        const summary = {date, gmv:0, commission:0, withdrawal:0, frozen:0, orders:0, account_count:filtered.length};
        filtered.forEach(r => {
            summary.gmv += r.gmv || 0;
            summary.commission += r.commission || 0;
            summary.withdrawal += r.withdrawal || 0;
            summary.frozen += r.frozen || 0;
            summary.orders += r.orders || 0;
        });
        result[date] = summary;
    }
    return Object.values(result).sort((a,b) => a.date.localeCompare(b.date));
}

// ========== 渲染 ==========
function renderAll() {
    const trend = getFilteredTrend();
    renderKPIs(trend);
    renderCharts(trend);
    renderAccountTable();
    renderOwnerTable();
    renderDetailTable();
}

function fmtNum(v) {
    if (v === undefined || v === null) return '0';
    if (Math.abs(v) >= 10000) return (v/10000).toFixed(2) + '万';
    if (Number.isInteger(v)) return v.toLocaleString();
    return v.toFixed(2);
}

function renderKPIs(trend) {
    const grid = document.getElementById('kpiGrid');
    if (trend.length === 0) { grid.innerHTML = ''; return; }

    const latest = trend[trend.length - 1];
    const prev = trend.length > 1 ? trend[trend.length - 2] : null;

    // 找周同比 (7天前)
    const latestDate = latest.date;
    const weekAgoDate = getDateOffset(latestDate, -7);
    const weekAgo = trend.find(d => d.date === weekAgoDate);

    const metrics = ['gmv','commission','withdrawal','frozen','orders'];
    const icons = {gmv:'💰', commission:'💵', withdrawal:'🏦', frozen:'🧊', orders:'📦'};

    grid.innerHTML = metrics.map(m => {
        const val = latest[m] || 0;
        const dayChange = prev ? calcPct(val, prev[m] || 0) : null;
        const weekChange = weekAgo ? calcPct(val, weekAgo[m] || 0) : null;

        return `<div class="kpi-card">
            <div class="label">${icons[m]} ${metricNames[m]}</div>
            <div class="value" style="color:${metricColors[m]}">${fmtNum(val)}</div>
            <div class="compare">
                ${dayChange !== null ? `<span class="${dayChange>=0?'up':'down'}">日环比 ${dayChange>=0?'+':''}${dayChange}%</span>` : ''}
                ${weekChange !== null ? `<span class="${weekChange>=0?'up':'down'}">周同比 ${weekChange>=0?'+':''}${weekChange}%</span>` : ''}
            </div>
        </div>`;
    }).join('');
}

function calcPct(cur, prev) {
    if (prev === 0) return cur > 0 ? 100 : 0;
    return ((cur - prev) / prev * 100).toFixed(1);
}

function getDateOffset(dateStr, days) {
    const d = new Date(dateStr);
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);
}

function renderCharts(trend) {
    const dates = trend.map(d => d.date);

    // GMV & 佣金
    charts.gmvCommission = echarts.init(document.getElementById('chartGmvCommission'));
    charts.gmvCommission.setOption({
        tooltip: { trigger: 'axis' },
        legend: { data: ['GMV', '佣金'], textStyle: {color:'#8899aa'} },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: { type: 'category', data: dates, axisLabel:{color:'#8899aa'}, axisLine:{lineStyle:{color:'#2a3a4e'}} },
        yAxis: { type: 'value', axisLabel:{color:'#8899aa', formatter:v=>fmtNum(v)}, splitLine:{lineStyle:{color:'#1e2d3d'}} },
        series: [
            { name:'GMV', type:'line', data:trend.map(d=>d.gmv), smooth:true, itemStyle:{color:'#4fc3f7'}, areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(79,195,247,0.3)'},{offset:1,color:'rgba(79,195,247,0)'}]}} },
            { name:'佣金', type:'line', data:trend.map(d=>d.commission), smooth:true, itemStyle:{color:'#ffa726'}, areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(255,167,38,0.2)'},{offset:1,color:'rgba(255,167,38,0)'}]}} }
        ]
    });

    // 出单
    charts.orders = echarts.init(document.getElementById('chartOrders'));
    charts.orders.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: { type: 'category', data: dates, axisLabel:{color:'#8899aa'}, axisLine:{lineStyle:{color:'#2a3a4e'}} },
        yAxis: { type: 'value', axisLabel:{color:'#8899aa'}, splitLine:{lineStyle:{color:'#1e2d3d'}} },
        series: [{
            name:'电商出单', type:'bar', data:trend.map(d=>d.orders),
            itemStyle: { color: {type:'linear', x:0,y:0,x2:0,y2:1, colorStops:[{offset:0,color:'#ab47bc'},{offset:1,color:'#7b1fa2'}]}, borderRadius:[4,4,0,0] }
        }]
    });

    // 提现 & 冻结
    charts.wf = echarts.init(document.getElementById('chartWithdrawalFrozen'));
    charts.wf.setOption({
        tooltip: { trigger: 'axis' },
        legend: { data: ['提现金额', '冻结金额'], textStyle: {color:'#8899aa'} },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: { type: 'category', data: dates, axisLabel:{color:'#8899aa'}, axisLine:{lineStyle:{color:'#2a3a4e'}} },
        yAxis: { type: 'value', axisLabel:{color:'#8899aa', formatter:v=>fmtNum(v)}, splitLine:{lineStyle:{color:'#1e2d3d'}} },
        series: [
            { name:'提现金额', type:'bar', stack:'total', data:trend.map(d=>d.withdrawal), itemStyle:{color:'#66bb6a', borderRadius:[4,4,0,0]} },
            { name:'冻结金额', type:'bar', stack:'total', data:trend.map(d=>d.frozen), itemStyle:{color:'#ef5350', borderRadius:[4,4,0,0]} }
        ]
    });

    // 归属人饼图
    charts.ownerPie = echarts.init(document.getElementById('chartOwnerPie'));
    const ownerData = (rawData.owner_totals || []).map(o => ({name:o.owner, value:o.gmv}));
    charts.ownerPie.setOption({
        tooltip: { trigger:'item', formatter:'{b}: {c} ({d}%)' },
        legend: { orient:'vertical', right:10, top:'center', textStyle:{color:'#8899aa'} },
        series: [{
            type:'pie', radius:['40%','70%'], center:['40%','50%'],
            data: ownerData,
            label: { color:'#8899aa' },
            emphasis: { itemStyle: { shadowBlur:10, shadowOffsetX:0, shadowColor:'rgba(0,0,0,0.5)' } }
        }]
    });
}

function renderAccountTable() {
    const tbody = document.querySelector('#accountTable tbody');
    const data = rawData.account_totals || [];
    tbody.innerHTML = data.map((a, i) => `<tr>
        <td>${i+1}</td>
        <td><strong>${a.account}</strong></td>
        <td>${a.owner}</td>
        <td><span class="${a.status && (a.status.includes('正常') || a.status.includes('活跃')) ? 'status-active' : 'status-inactive'}">${a.status || '-'}</span></td>
        <td>${fmtNum(a.gmv)}</td>
        <td>${fmtNum(a.commission)}</td>
        <td>${fmtNum(a.withdrawal)}</td>
        <td>${fmtNum(a.frozen)}</td>
        <td>${Math.round(a.orders)}</td>
        <td>${a.days_active || '-'}</td>
    </tr>`).join('');

    // 账号柱状图
    if (data.length > 0) {
        const top20 = data.slice(0, 20);
        charts.accountBar = echarts.init(document.getElementById('chartAccountBar'));
        charts.accountBar.setOption({
            tooltip: { trigger:'axis', axisPointer:{type:'shadow'} },
            legend: { data:['GMV','佣金'], textStyle:{color:'#8899aa'} },
            grid: { left:'3%', right:'4%', bottom:'15%', containLabel:true },
            xAxis: { type:'category', data:top20.map(a=>a.account), axisLabel:{color:'#8899aa', rotate:45, fontSize:11}, axisLine:{lineStyle:{color:'#2a3a4e'}} },
            yAxis: { type:'value', axisLabel:{color:'#8899aa', formatter:v=>fmtNum(v)}, splitLine:{lineStyle:{color:'#1e2d3d'}} },
            series: [
                { name:'GMV', type:'bar', data:top20.map(a=>a.gmv), itemStyle:{color:'#4fc3f7', borderRadius:[4,4,0,0]} },
                { name:'佣金', type:'bar', data:top20.map(a=>a.commission), itemStyle:{color:'#ffa726', borderRadius:[4,4,0,0]} }
            ]
        });
    }
}

function renderOwnerTable() {
    const tbody = document.querySelector('#ownerTable tbody');
    const data = rawData.owner_totals || [];
    tbody.innerHTML = data.map(o => `<tr>
        <td><strong>${o.owner}</strong></td>
        <td>${o.account_count}</td>
        <td>${fmtNum(o.gmv)}</td>
        <td>${fmtNum(o.commission)}</td>
        <td>${fmtNum(o.withdrawal)}</td>
        <td>${fmtNum(o.frozen)}</td>
        <td>${Math.round(o.orders)}</td>
    </tr>`).join('');
}

function renderDetailTable() {
    const tbody = document.querySelector('#detailTable tbody');
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    const account = document.getElementById('accountFilter').value;
    const owner = document.getElementById('ownerFilter').value;

    let rows = [];
    for (const [date, records] of Object.entries(rawData.daily_account_detail || {})) {
        if (date < start || date > end) continue;
        for (const r of records) {
            if (account && r.account !== account) continue;
            if (owner && r.owner !== owner) continue;
            rows.push({date, ...r});
        }
    }

    // 按日期倒序
    rows.sort((a,b) => b.date.localeCompare(a.date));

    // 限制显示条数避免卡顿
    const limit = 500;
    const showing = rows.slice(0, limit);

    tbody.innerHTML = showing.map(r => `<tr>
        <td>${r.date}</td>
        <td>${r.account}</td>
        <td>${r.owner}</td>
        <td><span class="${r.status && (r.status.includes('正常') || r.status.includes('活跃')) ? 'status-active' : 'status-inactive'}">${r.status || '-'}</span></td>
        <td>${fmtNum(r.gmv)}</td>
        <td>${fmtNum(r.commission)}</td>
        <td>${fmtNum(r.withdrawal)}</td>
        <td>${fmtNum(r.frozen)}</td>
        <td>${Math.round(r.orders)}</td>
    </tr>`).join('');

    if (rows.length > limit) {
        tbody.innerHTML += `<tr><td colspan="9" style="text-align:center;color:var(--text-secondary)">显示前 ${limit} 条，共 ${rows.length} 条</td></tr>`;
    }
}

// ========== Tab 切换 ==========
function switchTab(name) {
    ['overview','accounts','owners','detail'].forEach(t => {
        document.getElementById('tab-'+t).style.display = t===name ? 'block' : 'none';
    });
    document.querySelectorAll('.tab-bar button').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(
            {overview:'总览', accounts:'账号', owners:'归属人', detail:'明细'}[name]
        ));
    });
    // 切换 tab 后图表需要 resize
    setTimeout(() => Object.values(charts).forEach(c => c && c.resize()), 100);
}

// ========== 启动 ==========
init();
</script>
